<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convocadas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>⚽ Convocadas</h1>
    <p>Who's coming to every training session and match, without chasing anyone on WhatsApp.</p>
  </header>

  <main>
    <aside>
      <section class="card">
        <h2>New event</h2>
        <form id="event-form" novalidate>
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="training">Training</option>
            <option value="match">Match</option>
          </select>
          <div class="field-error" data-for="type"></div>

          <div class="row">
            <div>
              <label for="date">Date</label>
              <input id="date" name="date" type="date">
              <div class="field-error" data-for="date"></div>
            </div>
            <div>
              <label for="time">Time</label>
              <input id="time" name="time" type="time">
              <div class="field-error" data-for="time"></div>
            </div>
          </div>

          <label for="location">Location</label>
          <input id="location" name="location" type="text" maxlength="120" placeholder="Sports hall, court…">
          <div class="field-error" data-for="location"></div>

          <button type="submit">Create event</button>
          <div id="event-message" class="message" role="status"></div>
        </form>
      </section>
    </aside>

    <section>
      <h2>Upcoming events</h2>
      <ul id="event-list" class="event-list"></ul>
      <p id="event-empty" class="empty" hidden>No events yet. Create the first one.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
